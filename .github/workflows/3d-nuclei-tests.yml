name: Experimental 3D nuclei smoke tests

on:
  pull_request:
    paths:
      - "src/nuclei3d.py"
      - "tests/test_nuclei3d.py"
      - ".github/workflows/3d-nuclei-tests.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: python -m pip install --upgrade pip numpy scipy "scikit-image>=0.26.0"
      - name: Run synthetic invariants
        run: python -m unittest discover -s tests -v
